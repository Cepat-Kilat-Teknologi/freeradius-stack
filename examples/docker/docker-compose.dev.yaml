services:
  db:
    image: ${DB_IMAGE:-mysql:8.4}
    restart: unless-stopped
    container_name: radius-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-radius}
      MYSQL_USER: ${MYSQL_USER:-radius}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radiuspass123}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - radius-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    container_name: radius-redis-dev
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - radius-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  freeradius:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: freeradius-dev
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-radius}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radiuspass123}
      MYSQL_DBNAME: ${MYSQL_DBNAME:-radius}
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
      RADIUS_CLIENTS: ${RADIUS_CLIENTS:-}
      HEALTHCHECK_SECRET: ${HEALTHCHECK_SECRET:-testing123}
      RADIUS_DEBUG: ${RADIUS_DEBUG:-}
      RADIUS_ALLOW_PRIVATE_NETWORKS: "true"
      DO_NOT_IMPORT_DB: ${DO_NOT_IMPORT_DB:-}
      MYSQL_TLS_CA: ${MYSQL_TLS_CA:-}
      MYSQL_TLS_CERT: ${MYSQL_TLS_CERT:-}
      MYSQL_TLS_KEY: ${MYSQL_TLS_KEY:-}
      TZ: ${TZ:-Asia/Jakarta}
      ACCT_REDIS_ENABLED: ${ACCT_REDIS_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "127.0.0.1:18121:18121/udp"
    volumes:
      - radius_config:/etc/freeradius/3.0/custom
    networks:
      - radius-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

networks:
  radius-internal:
    driver: bridge

volumes:
  db_data:
  radius_config:
  redis_data:
