services:
  db:
    image: ${DB_IMAGE:-mysql:8.4}
    restart: unless-stopped
    container_name: radius-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DBNAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - radius-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    container_name: radius-redis
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
        else
          redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - radius-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  freeradius:
    image: ${FREERADIUS_IMAGE:-cepatkilatteknologi/freeradius:3.2.8}
    container_name: freeradius
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DBNAME: ${MYSQL_DBNAME}
      RADIUS_SECRET: ${RADIUS_SECRET}
      RADIUS_CLIENTS: ${RADIUS_CLIENTS:-}
      RADIUS_ALLOW_PRIVATE_NETWORKS: ${RADIUS_ALLOW_PRIVATE_NETWORKS:-true}
      RADIUS_DEBUG: ${RADIUS_DEBUG:-}
      DO_NOT_IMPORT_DB: ${DO_NOT_IMPORT_DB:-}
      MYSQL_TLS_CA: ${MYSQL_TLS_CA:-}
      MYSQL_TLS_CERT: ${MYSQL_TLS_CERT:-}
      MYSQL_TLS_KEY: ${MYSQL_TLS_KEY:-}
      HEALTHCHECK_SECRET: ${HEALTHCHECK_SECRET:-testing123}
      TZ: ${TZ:-Asia/Jakarta}
      ACCT_REDIS_ENABLED: ${ACCT_REDIS_ENABLED:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "127.0.0.1:18121:18121/udp"
    volumes:
      - radius_config:/etc/freeradius/3.0/custom
    networks:
      - radius-internal
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  radius-internal:
    driver: bridge

volumes:
  db_data:
  radius_config:
  redis_data:
