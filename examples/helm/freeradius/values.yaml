# FreeRADIUS Helm Chart Values

# Override chart name
nameOverride: ""
# Override full release name
fullnameOverride: ""

# Global settings
global:
  timezone: "Asia/Jakarta"

# Image pull secrets for private registries
imagePullSecrets: []
# - name: my-registry-secret

# FreeRADIUS configuration
freeradius:
  replicaCount: 2

  image:
    repository: cepatkilatteknologi/freeradius
    tag: "3.2.8"
    pullPolicy: IfNotPresent

  # RADIUS secret for client authentication
  # IMPORTANT: Change this value!
  secret: "CHANGE_ME_RADIUS_SECRET"

  # Internal healthcheck secret (localhost only)
  # Used for status server health probes
  healthcheckSecret: "CHANGE_ME_HEALTHCHECK_SECRET"

  # Use an existing secret instead of creating one
  # If set, the chart will not create a Secret resource
  existingSecret: ""

  # Additional RADIUS clients (comma-separated CIDR)
  # Example: "10.42.0.0/16,192.168.1.0/24"
  clients: ""

  service:
    type: LoadBalancer
    # externalTrafficPolicy: Local preserves the real NAS source IP (REQUIRED for
    # multi-NAS / per-NAS-secret setups — e.g. multiple accel-ppp BNG nodes, each a
    # distinct client in the `nas` table). With the default "Cluster", kube-proxy
    # SNATs incoming RADIUS packets and FreeRADIUS sees the node IP, breaking
    # per-NAS client/secret identification.
    # CAVEAT: "Local" only routes to nodes that run a FreeRADIUS pod — keep
    # replicaCount >= number of LB nodes and rely on topology spread / anti-affinity.
    # Ignored automatically when service.type is ClusterIP (e.g. local dev).
    externalTrafficPolicy: Local
    # Restrict source IPs (recommended for production — set to your BNG/NAS ranges):
    # loadBalancerSourceRanges:
    #   - 10.0.0.0/8
    #   - 192.168.0.0/16
    loadBalancerSourceRanges: []
    ports:
      auth: 1812
      acct: 1813
    # Optional: annotations for cloud providers
    # Static IP (GKE): networking.gke.io/load-balancer-type: "Internal"
    # Static IP (AWS): service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-xxx"
    # NLB (AWS): service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    annotations: {}

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Autoscaling (HPA)
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Additional environment variables
  extraEnv: []
  # - name: MY_VAR
  #   value: "my-value"

  # Additional volumes
  extraVolumes: []
  # - name: my-volume
  #   configMap:
  #     name: my-config

  # Additional volume mounts
  extraVolumeMounts: []
  # - name: my-volume
  #   mountPath: /etc/my-config

# MySQL configuration
mysql:
  # Set to false to use external MySQL
  enabled: true

  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent

  # Database credentials
  # IMPORTANT: Change these values!
  rootPassword: "CHANGE_ME_ROOT_PASSWORD"
  database: "radius"
  user: "radius"
  password: "CHANGE_ME_STRONG_PASSWORD"

  # Use an existing secret for MySQL credentials
  existingSecret: ""

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1000m"

# External MySQL configuration (when mysql.enabled=false)
externalMysql:
  host: ""
  port: 3306
  database: "radius"
  user: "radius"
  # Password should be set via --set or values file
  password: ""
  # Use an existing secret for external MySQL password
  existingSecret: ""

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# RBAC configuration
rbac:
  create: true

# Pod security context
podSecurityContext:
  fsGroup: 101

# Container security context
# Note: FreeRADIUS requires root for initial setup to configure files
# After initialization, the process runs as freerad user
securityContext: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
# Default: spread pods across nodes for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: freeradius
          topologyKey: kubernetes.io/hostname

# Backup configuration
backup:
  # Enable automated backups
  enabled: true

  # Cron schedule (default: daily at 2 AM)
  schedule: "0 2 * * *"

  # Number of days to retain backups
  retentionDays: 7

  # Job history limits
  historyLimit:
    success: 3
    failed: 3

  # Backup image (MariaDB client is compatible with both MySQL and MariaDB servers)
  image:
    repository: mariadb
    tag: "11"
    pullPolicy: IfNotPresent

  # Persistent storage for backups
  persistence:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Resources for backup job
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# Network policies
networkPolicy:
  enabled: false

# Metrics and monitoring
metrics:
  serviceMonitor:
    enabled: false
    interval: "30s"
    labels: {}

# Redis configuration (for optional accounting buffering)
redis:
  # Set to true to enable Redis accounting
  # Interim-Update packets will be buffered in Redis
  enabled: false

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  # Redis password (leave empty for no auth)
  password: ""

  # Use an existing secret for Redis password
  existingSecret: ""

  # Redis database number
  database: 0

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# External Redis configuration (when redis.enabled=false but accounting is needed)
externalRedis:
  host: ""
  port: 6379
  password: ""
  database: 0
  existingSecret: ""
