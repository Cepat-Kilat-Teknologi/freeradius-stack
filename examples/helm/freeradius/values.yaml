# FreeRADIUS Helm Chart Values

# Global settings
global:
  timezone: "Asia/Jakarta"

# FreeRADIUS configuration
freeradius:
  replicaCount: 2

  image:
    repository: cepatkilatteknologi/freeradius
    tag: "3.2.8"
    pullPolicy: IfNotPresent

  # RADIUS secret for client authentication
  # IMPORTANT: Change this value!
  secret: "CHANGE_ME_RADIUS_SECRET"

  # Internal healthcheck secret (localhost only)
  # Used for status server health probes
  healthcheckSecret: "CHANGE_ME_HEALTHCHECK_SECRET"

  # Additional RADIUS clients (comma-separated CIDR)
  # Example: "10.42.0.0/16,192.168.1.0/24"
  clients: ""

  service:
    type: LoadBalancer
    ports:
      auth: 1812
      acct: 1813
    # Optional: annotations for cloud providers
    # Static IP (GKE): networking.gke.io/load-balancer-type: "Internal"
    # Static IP (AWS): service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-xxx"
    # NLB (AWS): service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    annotations: {}

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# MySQL configuration
mysql:
  # Set to false to use external MySQL
  enabled: true

  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent

  # Database credentials
  # IMPORTANT: Change these values!
  rootPassword: "CHANGE_ME_ROOT_PASSWORD"
  database: "radius"
  user: "radius"
  password: "CHANGE_ME_STRONG_PASSWORD"

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1000m"

# External MySQL configuration (when mysql.enabled=false)
externalMysql:
  host: ""
  port: 3306
  database: "radius"
  user: "radius"
  # Password should be set via --set or values file
  password: ""

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 101

# Container security context
securityContext:
  runAsNonRoot: false
  # runAsUser: 101

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Backup configuration
backup:
  # Enable automated backups
  enabled: true

  # Cron schedule (default: daily at 2 AM)
  schedule: "0 2 * * *"

  # Number of days to retain backups
  retentionDays: 7

  # Job history limits
  historyLimit:
    success: 3
    failed: 3

  # Backup image (MariaDB client)
  image:
    repository: mariadb
    tag: "11"
    pullPolicy: IfNotPresent

  # Persistent storage for backups
  persistence:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Resources for backup job
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
