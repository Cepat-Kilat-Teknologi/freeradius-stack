apiVersion: v1
kind: Service
metadata:
  name: {{ include "freeradius.fullname" . }}
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    app.kubernetes.io/component: radius-server
  {{- with .Values.freeradius.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.freeradius.service.type }}
  {{- with .Values.freeradius.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and (ne .Values.freeradius.service.type "ClusterIP") .Values.freeradius.service.externalTrafficPolicy }}
  # Preserve the real NAS source IP so per-NAS secrets in the `nas` table match
  # and FreeRADIUS can identify which BNG/NAS each request came from. Without
  # this, kube-proxy SNATs the packet and FreeRADIUS sees the node IP instead.
  externalTrafficPolicy: {{ .Values.freeradius.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - port: {{ .Values.freeradius.service.ports.auth }}
      targetPort: radius-auth
      protocol: UDP
      name: radius-auth
    - port: {{ .Values.freeradius.service.ports.acct }}
      targetPort: radius-acct
      protocol: UDP
      name: radius-acct
  selector:
    {{- include "freeradius.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freeradius.fullname" . }}-status
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    app.kubernetes.io/component: status
spec:
  type: ClusterIP
  ports:
    - port: 18121
      targetPort: radius-status
      protocol: UDP
      name: radius-status
  selector:
    {{- include "freeradius.selectorLabels" . | nindent 4 }}
