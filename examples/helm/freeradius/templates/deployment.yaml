apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freeradius.fullname" . }}
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    app.kubernetes.io/component: radius-server
spec:
  replicas: {{ .Values.freeradius.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "freeradius.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freeradius.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: radius-server
    spec:
      serviceAccountName: {{ include "freeradius.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "freeradius.mysql.host" . }} {{ include "freeradius.mysql.port" . }}; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              echo "MySQL is ready"
      containers:
        - name: freeradius
          image: "{{ .Values.freeradius.image.repository }}:{{ .Values.freeradius.image.tag }}"
          imagePullPolicy: {{ .Values.freeradius.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 1812
              protocol: UDP
              name: radius-auth
            - containerPort: 1813
              protocol: UDP
              name: radius-acct
            - containerPort: 18121
              protocol: UDP
              name: radius-status
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_USER
            - name: MYSQL_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_DBNAME
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: TZ
            - name: RADIUS_CLIENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: RADIUS_CLIENTS
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: mysql-password
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: radius-secret
          resources:
            {{- toYaml .Values.freeradius.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/freeradius/3.0/custom
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "radclient -t 3 127.0.0.1:18121 status testing123 < /dev/null 2>&1 | grep -q Received"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "radclient -t 3 127.0.0.1:18121 status testing123 < /dev/null 2>&1 | grep -q Received"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          emptyDir: {}
