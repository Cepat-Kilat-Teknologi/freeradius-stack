apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freeradius.fullname" . }}
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    app.kubernetes.io/component: radius-server
spec:
  replicas: {{ .Values.freeradius.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "freeradius.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freeradius.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: radius-server
    spec:
      serviceAccountName: {{ include "freeradius.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              TIMEOUT=300
              elapsed=0
              echo "Waiting for MySQL (timeout: ${TIMEOUT}s)..."
              until nc -z {{ include "freeradius.mysql.host" . }} {{ include "freeradius.mysql.port" . }}; do
                elapsed=$((elapsed + 2))
                if [ $elapsed -ge $TIMEOUT ]; then
                  echo "ERROR: MySQL not ready after ${TIMEOUT}s"
                  exit 1
                fi
                echo "  Waiting ($elapsed/${TIMEOUT}s)..."
                sleep 2
              done
              echo "MySQL is ready"
      containers:
        - name: freeradius
          image: "{{ .Values.freeradius.image.repository }}:{{ .Values.freeradius.image.tag }}"
          imagePullPolicy: {{ .Values.freeradius.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 1812
              protocol: UDP
              name: radius-auth
            - containerPort: 1813
              protocol: UDP
              name: radius-acct
            - containerPort: 18121
              protocol: UDP
              name: radius-status
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_USER
            - name: MYSQL_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: MYSQL_DBNAME
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: TZ
            - name: RADIUS_CLIENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: RADIUS_CLIENTS
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.mysql.secretName" . }}
                  key: mysql-password
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.secretName" . }}
                  key: radius-secret
            - name: HEALTHCHECK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.secretName" . }}
                  key: healthcheck-secret
            {{- if or .Values.redis.enabled .Values.externalRedis.host }}
            - name: ACCT_REDIS_ENABLED
              value: "true"
            - name: REDIS_HOST
              value: {{ if .Values.redis.enabled }}{{ include "freeradius.fullname" . }}-redis{{ else }}{{ .Values.externalRedis.host }}{{ end }}
            - name: REDIS_PORT
              value: {{ if .Values.redis.enabled }}"6379"{{ else }}{{ .Values.externalRedis.port | quote }}{{ end }}
            - name: REDIS_DB
              value: {{ if .Values.redis.enabled }}{{ .Values.redis.database | quote }}{{ else }}{{ .Values.externalRedis.database | quote }}{{ end }}
            {{- if or .Values.redis.password .Values.externalRedis.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.fullname" . }}
                  key: redis-password
            {{- end }}
            {{- end }}
          {{- with .Values.freeradius.extraEnv }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.freeradius.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/raddb/custom
          {{- with .Values.freeradius.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "echo 'Message-Authenticator = 0x00' | radclient -t 3 127.0.0.1:18121 status $HEALTHCHECK_SECRET 2>&1 | grep -q Received"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "echo 'Message-Authenticator = 0x00' | radclient -t 3 127.0.0.1:18121 status $HEALTHCHECK_SECRET 2>&1 | grep -q Received"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          emptyDir: {}
      {{- with .Values.freeradius.extraVolumes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
