{{- if .Values.metrics.serviceMonitor.enabled }}
# NOTE: FreeRADIUS does not expose a native Prometheus metrics endpoint.
# This ServiceMonitor requires a RADIUS exporter sidecar (e.g. freeradius_exporter)
# that exposes HTTP metrics on the radius-status port. Without an exporter,
# Prometheus cannot scrape the UDP-based RADIUS status server directly.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "freeradius.fullname" . }}
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "freeradius.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: status
  endpoints:
    - port: radius-status
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
{{- end }}
