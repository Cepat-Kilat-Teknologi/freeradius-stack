{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "freeradius.fullname" . }}-backups
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - {{ .Values.backup.persistence.accessMode }}
  {{- if .Values.backup.persistence.storageClass }}
  storageClassName: {{ .Values.backup.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "freeradius.fullname" . }}-backup-scripts
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
data:
  backup.sh: |
    #!/bin/bash
    set -e

    BACKUP_DIR="${BACKUP_DIR:-/backups}"
    RETENTION_DAYS="${RETENTION_DAYS:-{{ .Values.backup.retentionDays }}}"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="radius_${TIMESTAMP}.sql.gz"

    mkdir -p "$BACKUP_DIR"

    echo "=== FreeRADIUS Database Backup ==="
    echo "Timestamp: $TIMESTAMP"
    echo "Database: $MYSQL_DBNAME@$MYSQL_HOST:$MYSQL_PORT"

    # Use temp file for atomic write
    TEMP_BACKUP="$BACKUP_DIR/${BACKUP_FILE}.tmp"

    if ! MYSQL_PWD="$MYSQL_PASSWORD" mysqldump \
        -h"$MYSQL_HOST" \
        -P"$MYSQL_PORT" \
        -u"$MYSQL_USER" \
        --single-transaction \
        --routines \
        --triggers \
        --add-drop-table \
        "$MYSQL_DBNAME" | gzip > "$TEMP_BACKUP"; then
        echo "Error: mysqldump failed" >&2
        rm -f "$TEMP_BACKUP"
        exit 1
    fi

    # Verify backup integrity
    if [[ ! -s "$TEMP_BACKUP" ]]; then
        echo "Error: Backup file is empty" >&2
        rm -f "$TEMP_BACKUP"
        exit 1
    fi

    if ! gzip -t "$TEMP_BACKUP" 2>/dev/null; then
        echo "Error: Backup corrupted" >&2
        rm -f "$TEMP_BACKUP"
        exit 1
    fi

    # Atomic move
    mv "$TEMP_BACKUP" "$BACKUP_DIR/$BACKUP_FILE"

    # Create latest symlink
    ln -sf "$BACKUP_FILE" "$BACKUP_DIR/latest.sql.gz"

    # Cleanup old backups
    find "$BACKUP_DIR" -name "radius_*.sql.gz" -type f -mtime +$RETENTION_DAYS -delete

    echo "Backup complete: $BACKUP_FILE ($(du -h "$BACKUP_DIR/$BACKUP_FILE" | cut -f1))"
    ls -lh "$BACKUP_DIR"

  restore.sh: |
    #!/bin/bash
    set -e

    BACKUP_FILE="${1:-/backups/latest.sql.gz}"

    if [[ ! -f "$BACKUP_FILE" ]]; then
        echo "Error: Backup file not found: $BACKUP_FILE"
        exit 1
    fi

    echo "Restoring from: $BACKUP_FILE"
    gunzip -c "$BACKUP_FILE" | MYSQL_PWD="$MYSQL_PASSWORD" mysql \
        -h"$MYSQL_HOST" \
        -P"$MYSQL_PORT" \
        -u"$MYSQL_USER" \
        "$MYSQL_DBNAME"

    echo "Restore complete"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "freeradius.fullname" . }}-backup
  labels:
    {{- include "freeradius.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.historyLimit.success }}
  failedJobsHistoryLimit: {{ .Values.backup.historyLimit.failed }}
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "freeradius.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: {{ include "freeradius.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: OnFailure
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 999
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/bash
                - /scripts/backup.sh
              env:
                - name: MYSQL_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "freeradius.fullname" . }}
                      key: MYSQL_HOST
                - name: MYSQL_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "freeradius.fullname" . }}
                      key: MYSQL_PORT
                - name: MYSQL_USER
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "freeradius.fullname" . }}
                      key: MYSQL_USER
                - name: MYSQL_DBNAME
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "freeradius.fullname" . }}
                      key: MYSQL_DBNAME
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "freeradius.mysql.secretName" . }}
                      key: mysql-password
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "freeradius.fullname" . }}-backups
            - name: scripts
              configMap:
                name: {{ include "freeradius.fullname" . }}-backup-scripts
                defaultMode: 0755
{{- end }}
