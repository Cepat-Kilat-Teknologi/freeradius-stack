# Radacct maintenance CronJob — runs daily at 03:00 (after backup at 02:00).
#
# Phases:
#   1. Delete CLOSED sessions older than 90 days
#   2. Delete STALE open sessions with no accounting update for 90+ days
#   3. Delete DUPLICATE active sessions per user per NAS (keep newest only)
#   4. Delete radpostauth auth logs older than 30 days
#
# Batched with LIMIT 50000 per iteration to avoid long table locks.
# Duplicate purge uses two-phase approach (SELECT IDs then DELETE by PK)
# to avoid Galera deadlock from self-JOIN on hot radacct table.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freeradius-maintenance
  namespace: freeradius
  labels:
    app.kubernetes.io/name: freeradius
    app.kubernetes.io/component: maintenance
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: freeradius
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          containers:
            - name: maintenance
              image: mariadb:11
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/bash
                - /scripts/maintenance.sh
              env:
                - name: MYSQL_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_HOST
                - name: MYSQL_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_PORT
                - name: MYSQL_USER
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_USER
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: freeradius-secret
                      key: mysql-password
                - name: MYSQL_DBNAME
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_DBNAME
                - name: RADACCT_RETENTION_DAYS
                  value: "90"
                - name: STALE_SESSION_DAYS
                  value: "90"
                - name: RADPOSTAUTH_RETENTION_DAYS
                  value: "30"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: freeradius-maintenance-scripts
                defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freeradius-maintenance-scripts
  namespace: freeradius
  labels:
    app.kubernetes.io/name: freeradius
    app.kubernetes.io/component: maintenance
data:
  maintenance.sh: |
    # Content is in scripts/maintenance.sh — copy it here or mount from repo.
    # See scripts/maintenance.sh for the full implementation.
    echo "Mount scripts/maintenance.sh into this ConfigMap"
    exit 1
