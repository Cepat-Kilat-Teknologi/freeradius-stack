# WARNING: Do NOT commit this file with real secret values!
# This file contains placeholder values only.
# For production, use one of these approaches:
#   - kubectl create secret generic freeradius-secret --from-literal=...
#   - External Secrets Operator
#   - Sealed Secrets
#   - SOPS + age/pgp encryption
apiVersion: v1
kind: Secret
metadata:
  name: freeradius-secret
  namespace: freeradius
  labels:
    app.kubernetes.io/name: freeradius
type: Opaque
stringData:
  # IMPORTANT: Change these values before deploying!
  mysql-root-password: "CHANGE_ME_ROOT_PASSWORD"
  mysql-password: "CHANGE_ME_STRONG_PASSWORD"
  radius-secret: "CHANGE_ME_RADIUS_SECRET"
  # Internal healthcheck secret (localhost only, can use any value)
  healthcheck-secret: "CHANGE_ME_HEALTHCHECK_SECRET"
