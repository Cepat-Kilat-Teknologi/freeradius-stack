apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: freeradius

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - mysql-statefulset.yaml
  - freeradius-deployment.yaml
  - redis-deployment.yaml
  - backup-cronjob.yaml
  - networkpolicy.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: freeradius-stack
    includeSelectors: false
