apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freeradius-backups
  namespace: freeradius
  labels:
    app.kubernetes.io/name: freeradius
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freeradius-backup-scripts
  namespace: freeradius
  labels:
    app.kubernetes.io/name: freeradius
    app.kubernetes.io/component: backup
data:
  backup.sh: |
    #!/bin/bash
    set -e

    BACKUP_DIR="${BACKUP_DIR:-/backups}"
    RETENTION_DAYS="${RETENTION_DAYS:-7}"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="radius_${TIMESTAMP}.sql.gz"

    mkdir -p "$BACKUP_DIR"

    echo "=== FreeRADIUS Database Backup ==="
    echo "Timestamp: $TIMESTAMP"
    echo "Database: $MYSQL_DBNAME@$MYSQL_HOST:$MYSQL_PORT"

    # Perform backup
    MYSQL_PWD="$MYSQL_PASSWORD" mysqldump \
        -h"$MYSQL_HOST" \
        -P"$MYSQL_PORT" \
        -u"$MYSQL_USER" \
        --single-transaction \
        --routines \
        --triggers \
        "$MYSQL_DBNAME" | gzip > "$BACKUP_DIR/$BACKUP_FILE"

    # Create latest symlink
    ln -sf "$BACKUP_FILE" "$BACKUP_DIR/latest.sql.gz"

    # Cleanup old backups
    find "$BACKUP_DIR" -name "radius_*.sql.gz" -type f -mtime +$RETENTION_DAYS -delete

    echo "Backup complete: $BACKUP_FILE"
    ls -lh "$BACKUP_DIR"

  restore.sh: |
    #!/bin/bash
    set -e

    BACKUP_FILE="${1:-/backups/latest.sql.gz}"

    if [[ ! -f "$BACKUP_FILE" ]]; then
        echo "Error: Backup file not found: $BACKUP_FILE"
        exit 1
    fi

    echo "Restoring from: $BACKUP_FILE"
    gunzip -c "$BACKUP_FILE" | MYSQL_PWD="$MYSQL_PASSWORD" mysql \
        -h"$MYSQL_HOST" \
        -P"$MYSQL_PORT" \
        -u"$MYSQL_USER" \
        "$MYSQL_DBNAME"

    echo "Restore complete"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freeradius-backup
  namespace: freeradius
  labels:
    app.kubernetes.io/name: freeradius
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: freeradius
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mariadb:11
              command:
                - /bin/bash
                - /scripts/backup.sh
              env:
                - name: MYSQL_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_HOST
                - name: MYSQL_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_PORT
                - name: MYSQL_USER
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_USER
                - name: MYSQL_DBNAME
                  valueFrom:
                    configMapKeyRef:
                      name: freeradius-config
                      key: MYSQL_DBNAME
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: freeradius-secret
                      key: mysql-password
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: "7"
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: freeradius-backups
            - name: scripts
              configMap:
                name: freeradius-backup-scripts
                defaultMode: 0755
