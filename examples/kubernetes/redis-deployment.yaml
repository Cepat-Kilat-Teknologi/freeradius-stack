# Redis deployment for accounting buffering (optional)
# NOTE: This is a basic deployment without persistence or password auth.
# For production, use the Helm chart which supports PVC persistence,
# password authentication, and external Redis configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: freeradius
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: freeradius
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: freeradius
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "128mb"
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: freeradius
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: freeradius
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  clusterIP: None
