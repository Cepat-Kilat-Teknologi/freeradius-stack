name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  # FreeRADIUS version - must match the version installed in Dockerfile
  # Actual version is verified post-build via freeradius -v
  IMAGE_VERSION: "3.2.8"
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE: cepatkilatteknologi/freeradius
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository_owner }}/freeradius

# Cancel superseded PR runs only; main and tag runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ========================
  # changes: classify the change set as code / non-code. Non-code-only
  # changes (docs, templates, repo metadata) report lint/build/vuln/test as
  # Skipped and publish no image. Tags, new branches, workflow_dispatch and
  # any classification failure count as code changes (fail safe).
  # ========================
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          out() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1 ($2)"; exit 0; }
          case "$EVENT" in
            pull_request) RANGE="$PR_BASE...$PR_HEAD" ;;
            push)
              [[ "$REF" == refs/tags/* ]] && out true "tag"
              [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] && out true "new branch"
              RANGE="$BEFORE..$SHA" ;;
            *) out true "event $EVENT" ;;
          esac
          if ! files=$(git diff --no-renames --name-only "$RANGE"); then out true "git diff failed"; fi
          [ -z "$files" ] && out true "no files listed"
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|LICENSE|LICENSE.*|.gitignore|.gitattributes|.editorconfig|.claude/*|CODEOWNERS|\
              .github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|\
              .github/PULL_REQUEST_TEMPLATE/*|.github/dependabot.yml|.github/actionlint.yaml|\
              .gitleaks.toml|.gitleaksignore|.github/workflows/gitleaks.yml|.env.example|.env.*.example|*.http) ;;
              *) out true "code file: $f" ;;
            esac
          done <<< "$files"
          out false "non-code only"

  # ========================
  # lint: Helm chart lint (same Helm version as helm.yml)
  # ========================
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint examples/helm/freeradius

  # ========================
  # build: multi-arch Docker build, never pushes
  # ========================
  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================
  # vuln: Trivy scan of a locally built image (report-only, same
  # severity and exit-code policy as the post-push scan in `image`)
  # ========================
  vuln:
    name: vuln
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: freeradius:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: freeradius:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ========================
  # image: Build & push Docker image (main and tags only, and only when
  # code changed and lint/build/vuln succeeded)
  # ========================
  image:
    name: image
    runs-on: ubuntu-latest
    needs: [changes, lint, build, vuln]
    if: >-
      ${{ !cancelled()
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      && needs.changes.outputs.code == 'true'
      && needs.lint.result == 'success' && needs.build.result == 'success'
      && needs.vuln.result == 'success' }}
    environment: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # Build and push to both registries
      - name: Build & Push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan for vulnerabilities
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        if: ${{ github.event_name != 'pull_request' }}
        with:
          image-ref: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_VERSION }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      # Detect actual FreeRADIUS version from built image
      - name: Detect FreeRADIUS version
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # Extract version from the amd64 image
          VERSION=$(docker run --rm --platform linux/amd64 ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_VERSION }} freeradius -v 2>/dev/null | grep -oP 'FreeRADIUS Version \K[0-9]+\.[0-9]+\.[0-9]+' || echo "${{ env.IMAGE_VERSION }}")
          echo "Detected FreeRADIUS version: $VERSION"
          if [ "$VERSION" != "${{ env.IMAGE_VERSION }}" ]; then
            echo "::warning::IMAGE_VERSION (${{ env.IMAGE_VERSION }}) does not match actual FreeRADIUS version ($VERSION). Update IMAGE_VERSION in ci.yml."
          fi

      # Generate artifact attestation for Docker Hub
      - name: Generate attestation (Docker Hub)
        uses: actions/attest-build-provenance@v2
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Generate artifact attestation for GHCR
      - name: Generate attestation (GHCR)
        uses: actions/attest-build-provenance@v2
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | \`${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.GHCR_IMAGE }}:${{ env.IMAGE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ========================
  # test: Docker Compose smoke test with RADIUS authentication
  # ========================
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && needs.build.result == 'success'
      && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: freeradius:test
          cache-from: type=gha

      - name: Start services
        working-directory: examples/docker
        run: |
          # Create test .env (no leading whitespace)
          cat > .env <<EOF
          MYSQL_USER=radius
          MYSQL_PASSWORD=testpass123
          MYSQL_HOST=db
          MYSQL_PORT=3306
          MYSQL_DBNAME=radius
          MYSQL_ROOT_PASSWORD=rootpass123
          RADIUS_SECRET=testing123
          HEALTHCHECK_SECRET=testing123
          TZ=UTC
          RADIUS_ALLOW_PRIVATE_NETWORKS=true
          ACCT_REDIS_ENABLED=false
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=
          REDIS_DB=0
          EOF
          # Strip leading whitespace from .env
          sed -i 's/^[[:space:]]*//' .env

          # Override image in compose
          FREERADIUS_IMAGE=freeradius:test docker compose up -d

      - name: Wait for services
        working-directory: examples/docker
        run: |
          echo "Waiting for all services to be healthy..."
          for i in $(seq 1 90); do
            HEALTHY=$(docker compose ps --format json | grep -c '"healthy"' || true)
            TOTAL=$(docker compose ps --format json | wc -l | tr -d ' ')
            echo "  Healthy: $HEALTHY / $TOTAL ($i/90)"
            if [ "$HEALTHY" -ge 3 ] 2>/dev/null; then
              echo "All services are healthy!"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Timeout waiting for services"
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 5
          done
          docker compose ps

      - name: Test RADIUS authentication
        working-directory: examples/docker
        run: |
          # Verify MySQL is actually accepting connections
          docker compose exec -T db mysqladmin ping -uroot -prootpass123 --silent

          # Add test user
          docker compose exec -T db mysql -uroot -prootpass123 radius -e \
            "INSERT INTO radcheck (username, attribute, op, value) VALUES ('testuser', 'Cleartext-Password', ':=', 'testpass') ON DUPLICATE KEY UPDATE value='testpass';"

          # Test auth (secret must match clients.conf localhost default)
          docker compose exec -T freeradius radtest testuser testpass localhost 0 testing123

      - name: Cleanup
        if: always()
        working-directory: examples/docker
        run: docker compose down -v --remove-orphans
